# Dev-only MySQL 8.0 for local exploration and the `mysql-dev` subagent.
# Bring it up from project root:
#   docker compose --env-file .env -f docker/docker-compose.dev.yml up -d
# (--env-file is required because docker compose otherwise looks for `.env`
# next to this file, but the project's `.env` lives at the repo root.)
# See `.env.example` for the variables this file consumes.

services:

  mysql:
    image: mysql:8.0
    container_name: ${MYSQL_CONTAINER_NAME:-mysql-dev}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_DEFAULT_USER}
      MYSQL_PASSWORD: ${MYSQL_DEFAULT_USER_PASSWORD}
      MYSQL_CLAUDE_USER: ${MYSQL_CLAUDE_USER}
      MYSQL_CLAUDE_USER_PASSWORD: ${MYSQL_CLAUDE_USER_PASSWORD}
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../scripts/bootstrap/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
